    for (let k = 1; k <= b.sets; k++) {
      out.push({ n: b.n, sub: `Série ${k}/${b.sets}`, s: b.s, t: b.t });

        out.push({ n: b.n, sub: 'RAILs', s: 15, t: 'Toujours en position : contracte dans l\'autre sens, comme pour décoller ou rapprocher, 15 s.' });

    }
  });
  return out;
}

function lineChart(pts, opts = {}) {
  if (pts.length < 1) return '';
  const W = 340, H = 170, L = 34, Rr = 8, T = 10, B = 22;
  const xs = pts.map(p => parseKey(p.d).getTime());
  const vals = pts.flatMap(p => [p.v, p.t].filter(v => v != null));
  if (opts.band) vals.push(...opts.band);
  let mn = Math.min(...vals), mx = Math.max(...vals); if (mx - mn < 1) { mn -= 0.5; mx += 0.5; }
  const padv = (mx - mn) * 0.12; mn -= padv; mx += padv;
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 864e5);
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - Rr), Y = v => T + (mx - v) / (mx - mn) * (H - T - B);
  const ticks = [mn + padv, (mn + mx) / 2, mx - padv];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Courbe')}">`;
  for (const tv of ticks) s += `<line x1="${L}" x2="${W - Rr}" y1="${Y(tv)}" y2="${Y(tv)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(tv) + 3}" text-anchor="end">${fr(tv)}</text>`;
  if (opts.limit != null && opts.limit > mn && opts.limit < mx) s += `<line x1="${L}" x2="${W - Rr}" y1="${Y(opts.limit)}" y2="${Y(opts.limit)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - Rr}" y="${Y(opts.limit) - 4}" text-anchor="end" style="fill:var(--warn)">${esc(opts.limitLbl || '')}</text>`;
  s += `<text x="${L}" y="${H - 6}">${esc(fmtShort(pts[0].d))}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">${esc(fmtShort(pts[pts.length - 1].d))}</text>`;
  pts.forEach((p, i) => { if (p.v != null) s += `<circle cx="${X(xs[i])}" cy="${Y(p.v)}" r="${opts.trend ? 2.4 : 3.2}" fill="${opts.trend ? 'var(--dim)' : 'var(--acc)'}"/>`; });
  const lineKey = opts.trend ? 't' : 'v';
  const lp = pts.map((p, i) => p[lineKey] != null ? `${X(xs[i]).toFixed(1)},${Y(p[lineKey]).toFixed(1)}` : null).filter(Boolean);
  if (lp.length > 1) s += `<polyline points="${lp.join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lastP = pts[pts.length - 1];
  if (lastP[lineKey] != null) s += `<circle cx="${X(xs[xs.length - 1])}" cy="${Y(lastP[lineKey])}" r="4.5" fill="var(--acc)" stroke="var(--s1)" stroke-width="2"/>`;
  return s + '</svg>';
}

function pickFile(accept, cb) { const f = $('#filepick'); f.value = ''; f.accept = accept; f.onchange = () => { const file = f.files && f.files[0]; if (file) cb(file); }; f.click(); }
async function shrinkImage(file, max = 1280) {
  try {
    const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch (e) { return file; }
}

  wDelNo: () => { UI.sheet.confirmDel = false; renderSheet(); },
  wDelYes: () => { Store.del(UI.sheet.id); closeSheet(); toast('Séance supprimée'); render(); },
  copySummary: () => { const w = Store.get(UI.sheet.id); if (!w) return; const txt = `${w.name} · ${fmtDay(w.date)}\n${fmtDur((w.end - w.start) / 1000)} · ${r0(w.vol)} kg soulevés\n` + w.items.map(it => `${exById(it.ex).n} : ${it.sets.map(fmtSet).join(', ')}`).join('\n') + (w.prs.length ? `\nRecords : ${w.prs.map(p => exById(p.ex).n + ' ' + fr(p.kg) + ' kg × ' + p.r).join(', ')}` : ''); navigator.clipboard.writeText(txt).then(() => toast('Résumé copié'), () => toast('Copie impossible ici')); },
  mobility: () => openSheet({ t: 'mobility', i: 0, pails: PAILS_DAYS.includes(new Date().getDay()) }),
  mobPails: () => { UI.sheet.pails = !UI.sheet.pails; renderSheet(); },
  mobGo: () => {
    unlockAudio(); const s = UI.sheet;
    if (!s.steps) s.steps = mobSteps(s.pails);
    if (s.run) { s.run = false; clearInterval(mobTimer); mobTimer = null; renderSheet(); return; }
    s.run = true; if (s.left == null) s.left = s.steps[s.i || 0].s; renderSheet();
    const total = s.steps.reduce((a, x) => a + x.s, 0);
    mobTimer = setInterval(() => {
      if (UI.sheet !== s) { clearInterval(mobTimer); mobTimer = null; return; }
      s.left--;
      if (s.left <= 0) { beep(); if (s.i >= s.steps.length - 1) { clearInterval(mobTimer); mobTimer = null; A.mobDone(); return; } s.i++; s.left = s.steps[s.i].s; renderSheet(); }
      else { const t = $('#mob-t'); if (t) t.textContent = fmtDur(s.left); const b = $('#mob-b'); if (b) { const done = s.steps.slice(0, s.i).reduce((a, x) => a + x.s, 0) + (s.steps[s.i].s - s.left); b.style.width = (done / total * 100) + '%'; } }
    }, 1000);
  },
  mobNext: () => { const s = UI.sheet; if (!s.steps) s.steps = mobSteps(s.pails); if ((s.i || 0) >= s.steps.length - 1) { A.mobDone(); return; } s.i = (s.i || 0) + 1; s.left = s.run ? s.steps[s.i].s : (s.left != null ? s.steps[s.i].s : null); if (s.left == null) s.left = s.steps[s.i].s; renderSheet(); },
  mobDone: () => { clearInterval(mobTimer); mobTimer = null; const d = getDay(today()); d.min = d.min || {}; d.mob = true; saveDay(d); UI.sheet = { t: 'mobility', done: true }; renderSheet(); render(); },
  planAdd: () => openSheet({ t: 'planAdd' }),
  planPick: (x, i) => { const d = getDay(today()); d.plan = (d.plan || []).concat([{ id: newId(), t: x, rid: x === 'muscu' ? i : undefined }]); saveDay(d); closeSheet(); render(); },
  planDel: x => { const d = getDay(today()); d.plan = (d.plan || []).filter(p => p.id !== x); saveDay(d); render(); },
  planGo: x => {
    const d = getDay(today()); const p = planState(d).find(z => z.id === x); if (!p) return;
    if (p.t === 'muscu') { if (p.done) { UI.tab = 'gym'; UI.gym = 'hist'; render(); } else startSession(p.rid); }
    else if (p.t === 'jjb') A.jjb();
    else { if (p.done) { d.mob = false; saveDay(d); render(); } else A.mobility(); }
  },
  goWeigh: () => { const i = $('#w-in'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); } },
  goalEdit: () => { const p = profile(); const g = p.goal ? Object.assign({}, p.goal) : { type: 'compet', cat: p.cat, gi: true, date: '', label: '' }; openSheet({ t: 'goal', g, maint: p.maint }); },
  goalType: x => { UI.sheet.g.type = x; renderSheet(); },
  goalGi: () => { UI.sheet.g.gi = !UI.sheet.g.gi; renderSheet(); },
  goalSave: () => { const s = UI.sheet, g = s.g; if (g.type === 'compet' && !g.date) { toast('Indique la date de la pesée.'); return; } if (g.type === 'poids' && !num(g.kg)) { toast('Indique le poids visé.'); return; } const p = profile(); p.goal = { type: g.type, label: (g.label || '').slice(0, 60), date: g.date || '', cat: num(g.cat) || p.cat, gi: !!g.gi, kg: num(g.kg) }; p.maint = num(s.maint) || p.maint; if (g.type === 'compet') p.cat = p.goal.cat; saveProfile(p); closeSheet(); toast('Objectif enregistré'); render(); },
  goalDel: () => { const p = profile(); p.goal = null; saveProfile(p); closeSheet(); render(); },
  goalApply: x => { const p = profile(); p.kcal = +x; p.c = Math.max(150, r0((p.kcal - p.p * 4 - p.f * 9) / 4)); saveProfile(p); toast(`Objectif passé à ${p.kcal} kcal (${p.c} g de glucides)`); render(); },
  // corps
  bodyTab: x => { UI.bodyTab = x; render(); },
  range: x => { UI.range = +x; render(); },
  measure: x => { UI.measure = x; render(); },
  wStep: x => { const i = $('#w-in'); const v = (num(i.value) || 82) + +x; i.value = fr(v); },
  saveWeight: () => { const v = num($('#w-in').value); if (!v || v < 30 || v > 250) { toast('Poids invalide'); return; } const b = body(); const k = today(); b.weights = b.weights.filter(w => w.d !== k).concat([{ d: k, kg: r1(v) }]); saveBody(b); toast('Pesée enregistrée'); render(); },
  delWeight: x => { const b = body(); b.weights = b.weights.filter(w => w.d !== x); saveBody(b); render(); },
  saveMeasure: () => { const m = { d: today() }; let any = false; for (const [k] of MEASURES) { const v = num($('#m-' + k).value); if (v) { m[k] = r1(v); any = true; } } if (!any) { toast('Remplis au moins une mesure.'); return; } const b = body(); const prev = b.measures.find(x => x.d === m.d); b.measures = b.measures.filter(x => x.d !== m.d).concat([Object.assign({}, prev || {}, m)]); saveBody(b); toast('Mesures enregistrées'); render(); },
  addPhoto: () => { if (!Caps.assets) return; pickFile('image/*', async f => { toast('Envoi de la photo…'); try { const blob = await shrinkImage(f, 1600); const r = await Caps.assets.upload(blob); const b = body(); b.photos = b.photos.concat([{ d: today(), id: r.id }]); saveBody(b); toast('Photo ajoutée'); render(); } catch (e) { toast('Envoi impossible : ' + (e && e.code === 'quota_exceeded' ? 'stockage plein.' : 'réessaie.')); } }); },
  viewPhoto: x => { const p = body().photos.find(z => z.id === x); openSheet({ t: 'photo', id: x, d: p && p.d }); },
  photoDel: () => { UI.sheet.confirm = true; renderSheet(); },
  photoDelNo: () => { UI.sheet.confirm = false; renderSheet(); },
  photoDelYes: async () => { const id = UI.sheet.id; const b = body(); b.photos = b.photos.filter(p => p.id !== id); saveBody(b); try { Caps.assets && await Caps.assets.delete(id); } catch (e) {} closeSheet(); render(); },
  // motivation
  addMsg: () => { const t = $('#msg-in').value.trim(); if (!t) return; const m = motiv(); m.items = (m.items || []).concat([{ type: 'text', text: t.slice(0, 200) }]); saveMotiv(m); render(); },
  addMedia: () => { if (!Caps.assets) return; pickFile('image/*,video/*', async f => { if (f.size > 20 * 1024 * 1024) { toast('Fichier trop lourd (20 Mo max).'); return; } toast('Envoi…'); try { const isV = f.type.startsWith('video'); const blob = isV ? f : await shrinkImage(f, 1600); const r = await Caps.assets.upload(blob); const m = motiv(); const t = ($('#msg-in') && $('#msg-in').value.trim()) || ''; m.items = (m.items || []).concat([{ type: isV ? 'video' : 'image', asset: r.id, text: t.slice(0, 200) }]); saveMotiv(m); toast('Carte ajoutée'); render(); } catch (e) { toast('Envoi impossible, réessaie.'); } }); },
  delMsg: x => { const m = motiv(); const [it] = m.items.splice(+x, 1); saveMotiv(m); if (it && it.asset && Caps.assets) Caps.assets.delete(it.asset).catch(() => {}); render(); },
  toggleMsg: x => { const m = motiv(); const h = new Set(m.hidden || []); h.has(+x) ? h.delete(+x) : h.add(+x); m.hidden = [...h]; saveMotiv(m); render(); },
  saveGoals: () => { const p = profile(); for (const k of ['kcal', 'p', 'c', 'f', 'minProt', 'cat']) { const v = num($('#p-' + k).value); if (v) p[k] = v; } saveProfile(p); toast('Objectifs enregistrés'); render(); },
  weekM: (x, i) => { const p = profile(); p.week = JSON.parse(JSON.stringify(p.week)); p.week[x] = Object.assign({}, p.week[x], { m: i }); saveProfile(p); render(); },
  weekJ: x => { const p = profile(); p.week = JSON.parse(JSON.stringify(p.week)); p.week[x] = Object.assign({}, p.week[x], { jjb: !(p.week[x] || {}).jjb }); saveProfile(p); render(); },
  export: async () => { if (!Caps.downloads) return; try { await Caps.downloads.save({ filename: `tatami-coach-${today()}.json`, data: JSON.stringify({ app: 'tatami-coach', v: 1, exported: new Date().toISOString(), docs: Store.docs }, null, 1) }); } catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') toast('Export impossible.'); } },
  import: () => openSheet({ t: 'import' }),
  keySave: () => { const v = ($('#api-key').value || '').trim(); if (!/^sk-ant-/.test(v)) { toast('Ça ne ressemble pas à une clé Anthropic (sk-ant-…).'); return; } try { localStorage.setItem('tc.apikey', v); } catch (e) {} Caps.sample = ApiSample; Caps.imgOk = true; toast('Clé enregistrée'); render(); },
  keyDel: () => { try { localStorage.removeItem('tc.apikey'); } catch (e) {} Caps.sample = null; Caps.imgOk = false; render(); },
  pushOn: async () => {
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('Notifications refusées. Réglages iPhone > Notifications > Tatami pour changer.'); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(VAPID_PUBLIC) });
      UI.pushSub = JSON.stringify(sub); render();
    } catch (e) { toast('Activation impossible : ouvre l\'appli depuis l\'icône de l\'écran d\'accueil.'); }
  },
  pushCopy: () => { const t = $('#push-code'); navigator.clipboard.writeText(UI.pushSub).then(() => toast('Code copié'), () => { t.select(); toast('Sélectionné : copie-le à la main'); }); },
  importPick: () => pickFile('application/json,.json', f => { const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); if (!j || j.app !== 'tatami-coach' || typeof j.docs !== 'object') throw 0; const ids = Object.keys(j.docs).filter(id => /^[A-Za-z0-9_.~:@+-]{1,180}$/.test(id) && j.docs[id] && typeof j.docs[id] === 'object'); UI.sheet.data = j.docs; UI.sheet.ids = ids; UI.sheet.preview = { n: ids.length, w: ids.filter(i => i.startsWith('w-')).length, d: ids.filter(i => i.startsWith('day-')).length }; UI.sheet.err = ''; } catch (e) { UI.sheet.err = 'Ce fichier n\'est pas un export de Tatami Coach.'; } renderSheet(); }; rd.readAsText(f); }),
  importYes: () => { const s = UI.sheet; for (const id of s.ids) Store.set(id, s.data[id]); closeSheet(); toast(`${s.ids.length} éléments importés`); render(); },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const fn = A[b.dataset.a]; if (!fn) return;
  e.preventDefault();
  fn(b.dataset.x, b.dataset.i);
});
document.addEventListener('input', e => {
  const t = e.target; const k = t.dataset && t.dataset.in; if (!k) return;
  const s = UI.sheet;
  if (k === 'foodq') { s.q = t.value; renderSheet(); }
  else if (k === 'porg') { s.g = t.value; renderSheet(); }
  else if (k === 'edg') { s.g = t.value; renderSheet(); }
  else if (k === 'esttxt') { s.txt = t.value; }
  else if (k === 'ideaq') { s.q = t.value; }
  else if (k === 'estg') { const it = s.items[+t.dataset.x]; const g = num(t.value); if (g > 0) { s.items[+t.dataset.x] = scaleItem(it, g); renderSheet(); } }
  else if (k === 'exq') { s.q = t.value; renderSheet(); }
  else if (k === 'glabel') s.g.label = t.value;
  else if (k === 'gdate') s.g.date = t.value;
  else if (k === 'gcat') s.g.cat = t.value;
  else if (k === 'gkg') s.g.kg = t.value;
  else if (k === 'gmaint') s.maint = t.value;
  else if (k === 'rtn') s.r.name = t.value;
  else if (k === 'rtt') s.r.tag = t.value;
  else if (k === 'rts') s.r.items[+t.dataset.x].sets = t.value;
  else if (k === 'rtr') s.r.items[+t.dataset.x].reps = t.value;
  else if (k === 'rtnote') s.r.items[+t.dataset.x].note = t.value;
  else if (k === 'kg' || k === 'r') { updActive(a => { const set = a.items[+t.dataset.x].sets[+t.dataset.i]; set[k] = t.value; }, true); const a = active(); lastSessKey = JSON.stringify(a) + '|' + UI.exMenu + '|' + UI.confirmCancel; }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.in === 'rtp') UI.sheet.r.items[+t.dataset.x].rest = +t.value; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) { closeSheet(); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && active() && !$('#session').hidden) { requestWake(); sessionTick(); } });

/* ========== démarrage ========== */
Store.load();
render();
if (active() && UI.tab) { /* séance en cours : bannière visible, reprise en un tap */ }
connect();
setInterval(() => { if (!UI.sheet && $('#session').hidden) scheduleRender(); }, 60000);
</script>
</body></html>
