<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Tatami Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-thumb phone app. Light "paper" look: warm off-white background, white cards with hairline borders,
   ink-black primary buttons, one vermillion accent (the tatami red). Dark "ink" blocks for the hero cards. */
:root{
  color-scheme:light;
  --bg:#F3F1EC; --s1:#FFFFFF; --s2:#F1EEE8; --s3:#E6E2DA; --line:#E4E0D7;
  --fg:#15171B; --mut:#6A6E76; --dim:#9EA1A8;
  --acc:#E8552D; --acc-ink:#FFFFFF; --ink:#15171B; --ink-fg:#FFFFFF;
  --ok:#17935A; --warn:#C98200; --bad:#D14343;
  --ok-t:#E2F3E9; --warn-t:#FBF0D9; --bad-t:#FBE9E7; --acc-t:#FDE7E0;
  --prot:#E39A12; --carb:#1E9C8E; --fat:#C4508C; --kcal:#E8552D;
  --fd:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px; --navh:66px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:80px}
input::placeholder,textarea::placeholder{color:var(--dim)}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.mut{color:var(--mut)} .small{font-size:13px}
#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.top .sub{font-size:14px;color:var(--mut)}
.top .sub::first-letter{text-transform:uppercase}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--ok)} .sync.slow i,.sync.local i{background:var(--warn)} .sync.err i{background:var(--bad)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero,.dark{--s1:#15171B;--s2:#24272D;--s3:#33373F;--line:#2C3036;--fg:#FFFFFF;--mut:#A8ACB4;--dim:#767A82;--ok-t:#1D3A2B;--acc-t:#40231A;background:var(--s1);color:var(--fg);border-color:#15171B}
.card.hero .btn.pri,.dark .btn.pri{background:var(--acc);color:#fff}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--s3);font-weight:600;font-size:16px}
.btn.pri{background:var(--ink);color:var(--ink-fg)}
.btn.acc{background:var(--acc);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid #EFC4C0;color:var(--bad)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.bar{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .3s}
.macro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.macro .m{display:flex;flex-direction:column;gap:5px;min-width:0}
.macro .v{font-family:var(--fd);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.macro .t{font-size:12px;color:var(--mut)}
.check{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:14px;background:var(--s2);text-align:left;width:100%}
.check .box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--dim);display:grid;place-items:center}
.check.on .box{background:var(--ok);border-color:var(--ok)}
.check.on .box::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check .txt{flex:1;min-width:0}
.check .txt b{display:block;font-weight:600}
.check .txt span{font-size:13px;color:var(--mut)}
.valid{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ok-t);color:var(--ok);font-weight:600}
.now{display:flex;flex-direction:column;gap:6px}
.now .big{font-family:var(--fd);font-weight:800;font-size:22px;line-height:1.15}
.meal{display:flex;flex-direction:column;gap:6px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .k{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;white-space:nowrap}
.list{display:flex;flex-direction:column}
.empty{color:var(--dim);font-size:14px;padding:4px 0}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:14px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--s1);color:var(--fg);box-shadow:0 1px 2px rgba(20,20,20,.12)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--s2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--fd);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s3);color:var(--mut)}
.pill.ok{background:var(--ok-t);color:var(--ok)} .pill.warn{background:var(--warn-t);color:var(--warn)} .pill.acc{background:var(--acc-t);color:var(--acc)}
.motiv{position:relative;border-radius:var(--r);overflow:hidden;min-height:150px;display:flex;align-items:flex-end;background:var(--ink);color:#fff}
.motiv::before{content:"";position:absolute;left:18px;top:18px;width:28px;height:4px;border-radius:2px;background:var(--acc)}
.motiv img,.motiv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.motiv .q{position:relative;padding:18px;font-family:var(--fd);font-weight:800;font-size:22px;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.motiv.media .q{background:linear-gradient(transparent,rgba(0,0,0,.7));width:100%}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(243,241,236,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#nav .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:640px;margin:0 auto;height:var(--navh)}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:-.01em}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--fg)}
#nav button.on svg{color:var(--acc)}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
#sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end}
#sheet-wrap .scrim{position:absolute;inset:0;background:rgba(21,23,27,.38)}
#sheet{position:relative;background:var(--s1);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 2px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-8px;background:var(--s1);padding-block:6px;z-index:2}
.x{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
/* session */
#session{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#session .in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(140px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.s-head{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-h h3{font-size:17px}
.last{font-size:13px;color:var(--mut)}
.last b{color:var(--fg);font-weight:600}
.sug{font-size:13px;color:var(--acc)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 48px;gap:6px;align-items:center}
.set.hd{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.set .no{width:34px;height:36px;border-radius:9px;background:var(--s2);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--mut)}
.set .no.w{color:var(--warn)}
.set .prev{font-size:13px;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{text-align:center;padding:8px 4px;height:42px;font-variant-numeric:tabular-nums}
.set .ok{width:48px;height:42px;border-radius:11px;background:var(--s3);display:grid;place-items:center}
.set.done .ok{background:var(--ok);color:#fff}
.set.done input{background:var(--ok-t);border-color:#A9DABF}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--s1);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rest .in2{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.rest .t{font-family:var(--fd);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.rest.over .t{color:var(--ok)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:10px;font-family:var(--fb)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photos button{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--s2);position:relative;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover}
.photos span{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px}
.mbar{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:14px}
.weekbars{display:flex;align-items:flex-end;gap:6px;height:90px}
.weekbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.weekbars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc);min-height:3px}
.weekbars span{font-size:10px;color:var(--dim)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--mut)}
.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:center}
.stepper input{text-align:center;font-family:var(--fd);font-weight:800;font-size:26px;height:56px}
.stepper button{height:56px;border-radius:14px;background:var(--s3);font-size:24px;font-weight:600}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bad-t);border:1px solid #EFC4C0}
.tip{font-size:14px;color:var(--mut);border-left:3px solid var(--acc);padding-left:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
#scan{position:fixed;inset:0;z-index:120;background:#000;display:flex;flex-direction:column}
#scan video{flex:1;width:100%;height:100%;object-fit:cover;min-height:0}
#scan .box{position:absolute;left:10%;right:10%;top:28%;height:22%;border:3px solid var(--acc,#8ab4ff);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
#scan .bar{background:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#scan .bar .row{display:flex;gap:8px}#scan .bar input{flex:1}
@keyframes restflash{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 9px var(--acc)}}
#session.flash{animation:restflash .6s ease-in-out 3}
.daynav{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:6px}
.daynav .grow{text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.daynav b{font-family:var(--fd);font-weight:800;font-size:17px;text-transform:capitalize}
.daynav .x[disabled]{opacity:.35}
.link{color:var(--acc);font-size:13px;font-weight:600}
.btn.add{background:var(--acc-t);color:var(--acc)}
.rmeal{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--s2)}
.rmeal .n{flex:1;min-width:0}.rmeal .n b{display:block;font-size:14px}.rmeal .n span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeal .k{font-size:13px;color:var(--mut);white-space:nowrap}
/* JJB */
.jhero{border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;background:var(--s1);color:var(--fg);position:relative;overflow:hidden}
.jhero>.row{position:relative;z-index:1}
.jhero::after{content:"";position:absolute;right:-36px;top:-36px;width:140px;height:140px;border:18px solid var(--acc);border-radius:50%;opacity:.9}
.jhero h1{font-size:44px;position:relative;z-index:1}
.jstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;z-index:1}
.jstats div{background:var(--s2);border-radius:14px;padding:10px}
.jstats b{display:block;font-family:var(--fd);font-weight:800;font-size:24px}
.jstats span{font-size:12px;color:var(--mut);line-height:1.2;display:block}
.seg.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:5;background:var(--s3)}
.jtheme h3{font-size:17px}
.jscore{font-family:var(--fd);font-weight:800;font-size:26px;white-space:nowrap}
.jscore small{font-size:14px;color:var(--mut);font-weight:600}
.jmedia{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.jm{position:relative;border-radius:12px;overflow:hidden;background:var(--s2);aspect-ratio:4/3}
.jm img,.jm video{width:100%;height:100%;object-fit:cover;display:block}
.jdel{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:1}
.jnote{display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}
.jnote p{margin:0}
.jnote h4{margin:10px 0 0;font-family:var(--fd);font-size:16px;font-weight:800}
.jnote a,.card a{color:var(--acc);word-break:break-all}
.jph{font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;align-self:flex-start}
a.chip{text-decoration:none;color:var(--fg)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.rtp{flex-direction:row;align-items:center;gap:12px}
.rtp .dot{width:10px;height:10px;border-radius:50%;flex:none}
.rtplay{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%}
.tg{width:50px;height:30px;border-radius:20px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(20px)}
.rtf{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:14px;padding:8px 8px 8px 12px}
.rtf .cb{width:4px;align-self:stretch;border-radius:4px;flex:none}
.rtstep{display:flex;align-items:center;gap:4px}
.rtstep button{width:44px;height:44px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:22px;touch-action:manipulation}
.rtstep .v{min-width:64px;text-align:center;font-family:var(--fd);font-weight:800;font-size:20px}
.rtcol{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.rtcol.on{border-color:var(--fg)}
.rttl{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px}
.rttl i{display:block;height:100%}
#rt-run{position:fixed;inset:0;background:var(--phase,#C98200);color:#fff;display:flex;flex-direction:column;z-index:110;transition:background .35s;font-family:var(--fb);-webkit-user-select:none;user-select:none}
#rt-run[hidden]{display:none}
#rt-run::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#rt-run.flash::after{animation:rtfl .5s ease-out 3}
@keyframes rtfl{0%{opacity:.75}100%{opacity:0}}
#rt-run .rtop{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;align-items:center;gap:10px}
#rt-run .rtop .nm{flex:1;font-weight:600;font-size:15px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#rt-run .rib{width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none}
#rt-run .rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px;min-height:0}
#rt-run .phase{font-family:var(--fd);font-weight:800;font-size:clamp(28px,8vw,46px);letter-spacing:.04em;text-transform:uppercase}
#rt-run .clock{font-family:var(--fd);font-weight:800;font-size:clamp(96px,31vw,220px);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:6px 0 10px}
#rt-run .counts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#rt-run .rpill{background:rgba(0,0,0,.2);border-radius:999px;padding:8px 16px;font-weight:600;font-size:clamp(16px,4.6vw,20px)}
#rt-run .rpill small{opacity:.75;font-weight:500}
#rt-run .next{margin-top:16px;opacity:.85;font-size:15px}
#rt-run .pbar{height:8px;margin:0 16px;background:rgba(0,0,0,.22);border-radius:6px;overflow:hidden}
#rt-run .pbar i{display:block;height:100%;background:rgba(255,255,255,.9);width:0}
#rt-run .rinfo{display:flex;justify-content:space-between;padding:8px 18px 0;font-size:13.5px;opacity:.85;font-variant-numeric:tabular-nums}
#rt-run .rctl{display:flex;align-items:center;justify-content:center;gap:22px;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
#rt-run .rctl button{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.2);display:grid;place-items:center;color:#fff}
#rt-run .rctl .big{width:92px;height:92px;background:#fff;color:#111}
#rt-run.paused .clock{animation:rtblink 1.2s steps(2,start) infinite}
@keyframes rtblink{to{opacity:.35}}
#rt-run .done-ttl{font-family:var(--fd);font-weight:800;font-size:48px}
#rt-run .rbtn{margin-top:18px;background:#fff;color:#111;border-radius:14px;padding:14px 20px;font-weight:700}
#rt-run .rconf{margin-top:16px;background:rgba(0,0,0,.35);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
#rt-run .rconf .rbtn{margin:0}
@media (orientation:landscape) and (max-height:500px){#rt-run .clock{font-size:min(34vh,26vw);margin:0}#rt-run .next{display:none}#rt-run .rctl{padding-top:6px}}

const Store = {
  docs: {}, col: null, inflight: {}, queued: {}, pending: new Set(), synced: false, state: 'local',

  flush() { clearTimeout(this._t); try { localStorage.setItem('tc.docs', JSON.stringify(this.docs)); localStorage.setItem('tc.pending', JSON.stringify([...this.pending])); } catch (e) {} },
  get(id) { return this.docs[id]; },

  del(id) { delete this.docs[id]; this.pending.add(id); this.persist(); if (this.col) this.push(id); },
  _deb: {},

  async push(id) {

        const d = this.docs[id];
        if (d === undefined) await this.col.doc(id).delete();

      } while (this.queued[id]);

function lineChart(pts, opts = {}) {

b23.tv/S1Fgnmi"], "ph": 13}, {"n": "Camping outside (Gordon Ryan)", "cat": "Passages", "body": "Orienter l’adversaire\nMain droite hanche gauche genoux\nPosition tripod avec la tete colle sur la poitrine pour eviter recompo lasso\nSe mettre a 90 degré pour qu’il puisse pousser sur le cote pas vers l’arrière sinon il peut recomposer\nMettre la pression et patienter pour passage ou meilleur position\nSi il attrape ma jambe avec sa jambe coller au sol possibilité de high step pire des cas chest to chest\nBon setup avec toreando et bon finish avc duck under", "links": [], "ph": 0}, {"n": "Chest to chest (Nicholas Meregali)", "cat": "Passages", "body": "Lorsqu’on ai en z guard aplatir ses hanches de l’autre cote les hanches et se concentrer dans un 1er temps sur le contrôle du bas du corp car au debut il a ses mains en frame APPLATIR cad pas essayer de passer de force le knee shield on met la main droite sur sa hanche position camping on se met sur la pointe des pieds et on essaye d’orienter ses hanches de l’autre cote EN MARCHANT VERS LA DROITE . Si on reste bloqué sur le knee shield malgre tt ça rester en camping puis tendre main droite pr qu’il puisse plus mettre knee shield. DILLEME KNEECUT lorsqu’il essayera de remettre le knee shield\nUne fois qu’on contrôle le bas du corps lorsqu’on met l’underhook peut importe tripod ou crossface le  plus important et de faire en sorte que ses épaules soient colle au sol meme si il repousse avec ses frames main et qu’on a pas d’underhook on se concentre sur applatir ses hanches et ses epaules\nPour battre ses derniers frames bras on camp et on joue avec la direction de nos mains et notre tete: passer entre ses bras, pousser, tirer, glisser notre tete…\nOn peut utiliser sa tete des 2 cote pour pousses ses frames (tete vers son nombril / plexus ) et on pousse vraiment ses bras on peut le mettre sur le cote de son bras et passe en 3/4 mount…\nNe pas mettre hanche gauche sur le mat mais essayer de l’avoir sur lui et peser sur lui\nCrossface grip meregali: le bras gauche va loin il attrape son aisselles et le ramene vers lui mettre la pression avec le biceps et mettre notre tete a plat tt a droite\nPrincipe de tordre son corp pr finir les passages\nPour aller en 3/4 on part vers la droite et on sort notre genou\ncrossface grip meregali on part vers la droite et on sort notre genou pr aller en 3/4 si il tient et que sa main droite est leve on change de cote le crossface notre main droite prend loin derrière son kim pression biceps on a pas d’underhook mais monté facile\nCrossface en 3/4 on doit mettre le plus d’espace possible entre son bras pris et ses hanches. Position tripod Pour sortir notre jambe dans la demi avec la jambe gauche on viens pas seulement pousser ses jambes on met la jambe gauche sur sa cuisse et on sprawl dessus .\nCrossface en 3/4 on change sa tete de cote leve fort nos hanches knee cut on prend l’autre underhook et on kick sa jambe .\nEn 3/4Backtake possible avec underhook gauche\nSi l’adversaire met un crochet papillon ob met notre hanche gauche sur le mat on met bien le crosse face meregali puis on va tt a droite on cherche la monte ou au pire on arrive c to c\nSoumission : en c2c on garde l’underhook et on fait passer la jambe gache par dessus sa tete on peut kimura\nSoumission 2 meme setup armbar : pour casser son grip on prend grip kimura avec notre jambe gauche du coup libre on kick sa jambe pour sortir notre jambe droite de la demi on fait une x dans ses bras et ça devrait passer\nSoumission 3 : en c2c on prend une sorte de crucifix avec notre jambe gauche on se met sur hanche gauche on tend son bras il liberera notre jambe droite on ferme une sorte de triangle du mauvais cote on attrape son bras au niveau du coupe grip calin on le ramene vers sois et on avance la tete il peut souvent se lever transition facile kimura triangle omoplata…\nSoumission 4 de Thibault avec lapel", "links": [], "ph": 0}, {"n": "Chest to chest (Gordon Ryan)", "cat": "Passages", "body": "中英双语Gordon Ryan Half Guard Passing 过半防 (vidéo dans les liens)\nconcept et placement\nPrendre son temps dans la position mettre son poids sur poitrine adversaire\nBATTRE KNEE SHIELD :\nil faut enchainer tt ses techniques envoyer bcp d’info et par moment feinter crosseface ou underhook et tourner poigner pr prendre autre chose\non peut poser nos deux mains sur l’epaule de l’adversaire et notre front sur son epaule gauche marcher vers la droite et avoir le c2c\n[photo]\nSi ça marche pas on peut egalement sur mettre sur ses hanches\n[photo]\nDe la on feinte le passage ou des soumissions pr qu’il concede le c2c on sort le genou lorsqu’il veut le repousser on prend l’underhook et le c2c\n[photo]\non peut se lever se mettre en headquarter et bloquer le knee shield avec le bras\nDilemme crazy dog ou main sur les hanches et on cherche inside position\nLorsque l’on inverse les hanches (ou dans d’autres situations) mais qu’on arrive pas a passer on prend le grip pantalon en attrapant sa cheville et on met bien la pression sur la personne\n[photo]\nDe la on peut 1/ mettre la pression vers la droite et OUVRIR coude pour passer  2/ backstep ou highstep pour passer 3/ prendre direct la montée si il shoot son pied 4/ faire des dilemmes avec tt ca\nPrendre grip over under pousser le knee shield vers la droite et mettre notre genou gauche sur lui tt en gardant notre cheville gauche entres ses 2 jambes\n[photo]\nDe la on peut passer en backstep puis sortir son genou pris ou 360 vers la gauche to saddle ou leg locks\nBattre crochet papillon\nFaire peser les hanches vers l’arrière attraper le genou dilemme montee ou kneecut\nFinir chest to chest\nAu dela de fermer le grip sur le crossface il faut fermer les coudes a part si on passe en tripod on met loins les mains\nOn part vers la droite pour eviter qu’il remette le genou ou crochet papillon\nPassage en side en levant les hanches position tripod et genou le plus haut possible pour eviter le knee shield et knee cut au lieu de knee cut\nPour aller en monter meme schema mais on va a droite et liberer patiemment genou avec jambe gauche\nPour soumettre pendant qu’on prend la montée on met tibia gauche sur son bras et on ferme une sorte de triangle\n[photo]\nde la on prend kimura grip et on ferme le triangle : de la finish en triangle (on tire la deuxième main pour mieux finir, ou kimura, ou si il ferme ses mains armbar ou cle de poignée\n[photo]", "links": ["https://b23.tv/XbK1wiY"], "ph": 8}, {"n": "Clé de cheville (Musumeci + YT)", "cat": "Soumissions", "body": "La tete doit etre aligné au genoux\nDescendre max grip cheville et important :faire un cercle en attrapant la cheville pour attraper la partie faible\nPression sur les petits doigts pas les gros\nOn supprime l’épaule on se met complètement sur l’epaule et on doit reculer nos hanches et epaules on met la main droite au sol et on se pousse pour faire un arc de cercle (notre dos se rapproche de son autre pied)\nBreaking mecanique : la pression doit également etre mise sur le haut du tibia ça créer la tension s’aider en tenant grip tibia main (comme stv casser un stylo en 2 tu vas prendre les 2 extrémités pas juste un bord)\nFrame avec les jambes très important en butterfly ashi(ba) le bout des doigts de pied touche l’érouller de l’autre jambe, en single x(sx) la jambe gauche connecte a mon genoux serrer fort\nRetention ba : jambe du haut si il l’a met vers l’extérieur je fais degripper comme spider si il l’a met vers l’intérieur enrouler sa main comme sortie spider et la pousser\nRetention ba jambe du bas : si il veut l’attraper je pousse avec main droite son col , si il l’a attrapé je me met sur mon epaule gauche je sureleve sa jambe et je rentre le genou de la jambe du bas a l’intérieur pr bon crochet\nBellydown depuis ba : on le pousse fort en mettant pied droit sur pec quand il est a distance on se met sur les genoux garder pied gauche la ou il est la et pied droit qui le pousse. Puis front au sol genou qui s’écarte on fait la cle et on descend t le tibia sur son biceps on leve nos hanches il va degripper\nTransitions :\nDLR : Quand il ferme bien debout de sorte a ce que je ne puisse pas attaquer le haut de son corps on oriente nos hanches et on prend dlr avec un crochet bien mis : de la si on tirer fort son bras et kick son epaule avec jambe droite on a facilement omoplata si il rentre le coude scissor\nAutre possibilité sweep depuis transition dlr :\n[photo]\nDepuis la collar sleeve dlr bcp de sweep type situp possible\nK guard\nMatrix\nDlr x\nSoumissions :\nOmoplata : On met notre genou sur son biceps et casse bien la posture puis on envoie\n[photo]\nArmbar :Lorsqu’il se met dans une sorte de headquarter genou droit au sol on fait une cle de bras sur son autre bras en formant comme une omoplata\n[photo]\ntriangle depuis scissor sweep 2 on a facilement sa main et sa tete avant de parfaitement réajuster le triangle on croise son bras pour faciliter\nLoop choke souvent possible quand adversaire a genoux a combiner avec scissor\nsweep :\nscissor sweep possible quand il pose le genou droit on ramene son col jusqu’a notre genou on met le pied droit sous son aisselle et on envoie\n[photo]\nAutre variation quand il est fort on met notre tibia en barrage sur son bras et torse on se met sur notre coude et avec la jambe gauche on kick son genou (de cette position triangle facile)\n[photo]", "links": [], "ph": 7}, {"n": "Deep half to X (Will Wilson)", "cat": "Gardes", "body": "Commencer de préférence le placement du pied gauche des le début\nPour ajuster les crochet penser a pousser l’adversaire vers le haut et tt droit mais ne pas le laisser s’échapper\nAjuster le crochet gauche puis le droit\nAutre cle possible x debout, sol , sx cross, 50/50, caio terra(dlr)…", "links": [], "ph": 0}, {"n": "De la Riva (passage)", "cat": "Passages", "body": "SHUTTING DOWN THE DE LA RIVA : 泰楠过德拉 (vidéo dans les liens)\nposition\non est paralelle a l'adversaire et le genou et les orteilles pointent vers l'exterieur\njambe libre constamment active\non ouvre pas juste le genou on essaye d'emmener notre jambe droitee le plus a droite possible\nappuyer sur son croche dlr\nson autre jambe on le met en headquarter ou on la tend\npassages\nWindshield Wiper : on tend sa jambe libre et on colle notre poitrine contre son tibia\n[photo]\npuis grip ceinture avec main gauche on pousse son crochet au point qu'il touche le sol, on ouvre notre genou puis on le met au sol derriere son crochet notre tibia touche son tibia de la on peut sprawl pour enlever le grip, crazy dog, longstep , passage en pression, knee cut...\nknee cut : on se met en headquarter, genou gauche met la pression sous sa cuisse, on prend un underhook pas grave si il est pas haut on remonte pendant la technique, on fait un grand pas avec le pied pas pris sur le cote avec l'autre main on pousse son genou s il est fort et qu'on arrive pas a l'envoyer\n[photo]\npuis on pose cette main loin devant au sol on envoie le knee cut : notre genou bouge avant notre corps pour guider : on croise : e haut a gauche pas juste a gauche, on ajuste l'underook on colle sa poitrine et on finit.\nsi pendant le knee cut il arrive a avoir un knee shield c qu'on est parti sur le cote au lieu de en croise (en haut + cote) si malgre tt on arrive dzns cette position on attrape nos mains sur l'underhook on le tire vers nous on inverse les hanches 2 fois et on finit\nsi on a pas acces a l'underhook on prend le col on ferme le coude on fait les memes etapes au moment d'envoyer le knee cut on le tire vers nous puis pour finir on le plante au sol\nleg weave : headquarter on attrape le col on tape son genou vers le bon cote puis on attrape la hanche on met tt son corps sur le cote\n[photo]", "links": ["https://b23.tv/BMlev40"], "ph": 3}, {"n": "Duck under (Cole Abate)", "cat": "Passages", "body": "On attrape la ceinture avec les 2 mains, Si l’adversaire ne met pas de poid sur sa jambe pas besoin de ce mettre sur les hanches meilleur position :\n[photo]\nPassage de base : on prend son col opposé et on ne va pas seulement en side on le tir pour le ramener vers nous\n[photo]\nSi il met du poid sur ces jambes on peut passer en long step de l’autre cote\nPour leg drag on se met complètement sur l’epaule\n[photo]\nPuis on prend son genou droit le balance de l’autre cote et on tend notre jambe droite", "links": [], "ph": 3}, {"n": "K guard (Lachlan Giles)", "cat": "Gardes", "body": "DeepSeek-R1中英双语 蓝蓝 - K Guard (vidéo dans les liens)\nConcept : genou adveraire sur notre estomac\n[photo]\nKguard to spin 70/30 to back\n[photo]\nK guard to x\n[photo]\nK guard to ankle lock\n[photo]", "links": ["https://b23.tv/0VogQmk"], "ph": 4}, {"n": "K guard (Cole Abate)", "cat": "Gardes", "body": "Charger l’adversaire vers l’avant quand on place la guard\nMain droite col opposé\nCasser la posture\nSi l’adversaire attaque la jambe droite je kick bien son arrière epaule avec jambe gauche ou transition en single x\nSi l’adversaire vers l’arrière transition x\nSi vers l’avant transition matrix\nSweep : passer vers l’arrière, x, sweep type x en kickan, matrix,\nSoumissions (surtout si il veut attaquer ma jambe): triangle , omoplata , shutgun armbar leg locks", "links": [], "ph": 0}, {"n": "Knee cut", "cat": "Passages", "body": "Lucas Lepri Precision Knee Cut Passes (vidéo dans les liens)\ndepuis dlr :\non attrape le col et pantalon cheville de l'adversaire\n[photo]\non met notre coude sur son crochet dlr pour l'affaiblir\n[photo]\non backstep avec la jambe gauche et on le ramene vers nous en meme temps puis on le fait tourner en tournant sa jambe et on avance le genou. si il arrive quand meme a mettre un knee shield grace au poid de ma jambe exterieur je donne un coup d'epaule  a son knee shield sur le cote pour l'enlever\n[photo]\nlorsqu'il va vouloir frame on attrape son triceps et on profite pour finir le passage.\nweave pass :\non fait quand il met un knee shield et que mon bras qui tient le col est plus en frame : on garde le col on plante le coude sur son function jjbData() {

  if (!d) {
    const mk = (n, target, score, extra) => Object.assign({ id: 't' + newId(), n, st: 'cur', target, score, moves: [], note: '', links: [], media: [], log: [] }, extra || {});
    d = {
      kind: 'jjb', v: 1,
      method: 'Chaque phase : drill, puis thème, puis à mettre en sparring.\n5 techniques max par bloc.',
      links: [{ t: 'Train BJJ (vidéos)', u: 'https://m.vkvideo.ru/@bjjforeveryone' }],
      pts: { good: 2, white: 1 },
      themes: [
        mk('Stack pass / cross grip', 15, 9),
        mk('Over under', 15, 10),
        mk('HQ', 30, 1, { note: 'Regarder la vidéo (knee cut, leg weave…)' }),
        mk('Ankle S', 30, 16, { moves: [{ n: 'K to X', p: 1 }, { n: 'Ankle', p: 2 }] }),
        mk('Demi', 100, 8, { moves: [{ n: 'Waiter sweep', p: 1 }, { n: 'Waiter deep to X', p: 2 }, { n: 'Backtake', p: 3 }, { n: 'Choibar', p: 3 }] }),
        mk('Ninja choke / Mougouchoke', 30, 2),
      ].concat(JJB_SEED.fut.map(f => mk(f.n, 30, 0, { st: 'fut', links: f.links }))),
      spec: [
        { id: 's' + newId(), n: 'Headquarter', note: 'Rentrer / maintenir / passer', ok: 0 },
        { id: 's' + newId(), n: 'Demi', note: '', ok: 0 },
        { id: 's' + newId(), n: 'Prise de dos', note: 'Maintenir connexion chest to back sans accrocher ses mains -> bodylock dans le dos.\nBut : prendre le dos avec ceinture de sécurité ou maintenir connexion -> dos 1 crochet.\nBut : soumission ou rester 10 secondes avec 3 crochets.', ok: 0 },
      ],
    };
    if (IS_ARTIFACT && !Store.synced && Store.state !== 'local') return d; // on attend tes données avant de créer quoi que ce soit
    Store.set('jjb', d);
    if (!Object.keys(Store.docs).some(id => id.startsWith('jt-'))) JJB_SEED.enc.forEach((e, i) => Store.set('jt-' + newId() + i, { kind: 'jtech', n: e.n, cat: e.cat, body: e.body, links: e.links, media: [], status: 'learn', ph: e.ph, up: Date.now() }));
  }

}
